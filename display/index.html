<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 千万别加 initial-scale=1：这块屏物理 800x480，但 density=240 让它在浏览器眼里
     只有 534x320 CSS px。锁死 scale=1 就是把 800 宽的页面按 1:1 塞进 534 的视口，
     只能露出 67%。不锁，浏览器自己缩到 0.6675，渲染出来正好 1:1 物理像素。 -->
<meta name="viewport" content="width=800, viewport-fit=cover">
<title>Codex</title>
<style>
  /* 自带 Roboto，两端才一致：system-ui 在 Mac 上解析成 SF Pro、在 Android 上是 Roboto，
     字形差异明显。Roboto 是 Android 原生字体且 Apache 2.0 可自由分发（SF Pro 不行）。
     必须是静态字重——Chromium 61 不支持可变字体，可变版本会整个 fallback 掉。 */
  @font-face { font-family:'Roboto'; font-style:normal; font-weight:400;
               font-display:swap; src:url(roboto-400.woff2) format('woff2'); }
  @font-face { font-family:'Roboto'; font-style:normal; font-weight:500;
               font-display:swap; src:url(roboto-500.woff2) format('woff2'); }
  @font-face { font-family:'Roboto'; font-style:normal; font-weight:700;
               font-display:swap; src:url(roboto-700.woff2) format('woff2'); }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { height:100%; }
  html, body {
    width:800px; background:#000; color:#fff;
    overflow-x:hidden;
    /* 横向手势归我们，纵向留给浏览器——它要靠竖滑来收起顶部控制条 */
    -ms-touch-action:pan-y; touch-action:pan-y;
    /* Roboto 只覆盖拉丁字形；中文仍走系统字体（Mac 是 PingFang，设备上是 Noto Sans CJK） */
    font-family:Roboto,"PingFang SC","Noto Sans CJK SC","Droid Sans Fallback",sans-serif;
    -webkit-font-smoothing:antialiased; user-select:none; cursor:none;
  }
  /* 比视口高一点：给浏览器留出收起控制条所需的滚动量。
     内容是 fixed 的，所以这段滚动不会把界面推走。 */
  body { padding:0; min-height:calc(100% + 90px); }

  /* 两页并排放进一条 1600px 的横轨，靠平移切换。
     必须 absolute：否则 1600px 会撑开文档，viewport=800 的老 WebView 会把整页缩到 50%。 */
  .stage {
    position:fixed; top:0; left:0; width:800px; height:480px; overflow:hidden; z-index:1;
  }
  .deck {
    position:absolute; top:0; left:0; width:4000px; height:480px;
    -webkit-transition:-webkit-transform .28s ease; transition:transform .28s ease;
  }
  .deck.p1 { -webkit-transform:translateX(-800px); transform:translateX(-800px); }
  .deck.p2 { -webkit-transform:translateX(-1600px); transform:translateX(-1600px); }
  .deck.p3 { -webkit-transform:translateX(-2400px); transform:translateX(-2400px); }
  .deck.p4 { -webkit-transform:translateX(-3200px); transform:translateX(-3200px); }
  /* 滑动是全局最重的一帧（1600×480 整体位移），期间把运镜停掉、
     并临时提示合成层。will-change 只在这 0.3 秒存在，不常驻。 */
  .deck.dragging { will-change:transform; }
  .deck.dragging .photo { -webkit-animation-play-state:paused; animation-play-state:paused; }
  .page { position:absolute; top:0; width:800px; height:480px; }
  .page.a { left:0; }
  .page.b { left:800px; }
  .page.s { left:1600px; }
  .page.c { left:2400px; }
  .page.f { left:3200px; }

  /* 指示点落在卡片底部那 30px 空白里，不跟着 deck 平移 */
  .dots { position:fixed; left:0; width:800px; bottom:14px; text-align:center; z-index:5; }
  .dots i {
    display:inline-block; width:6px; height:6px; margin:0 5px; border-radius:50%;
    background:rgba(255,255,255,.22);
    -webkit-transition:background .2s; transition:background .2s;
  }
  .dots i.on { background:rgba(255,255,255,.7); }

  .card {
    position:relative; width:800px; height:480px;
    overflow:hidden; color:#fff; background:#0a0d12;
  }

  /* 照片：主峰在原图 (33%,20%)，对到卡片 (66%,24%)。
     原图是高调灰白全景，先压暗再强拉对比做 S 曲线：
     白雪 1.0 → .46 → .44，中间调 .5 → .23 → .09，雪脊留住，其余沉进底色。
     老 WebView 只认带前缀的 filter，两个都写。 */
  /* 图已预裁成 772×452（和卡片 1:1），几何统一 cover，逐张只剩调色。
     运镜必须用 transform：动 background-position 会每帧作废整张 paint、
     重光栅 + 重跑滤镜，约 1.4MB/帧。 */
  .photo {
    position:absolute; top:0; right:0; bottom:0; left:0; z-index:0;
    background-repeat:no-repeat; background-position:center; background-size:cover;
    /* 调色已烘进 JPEG，这里不留 filter：每帧的色彩矩阵 shader 没了。
       也不用 will-change——它让每层常驻显存并按最大 scale 光栅化，
       在 GE8300 这种入门 GPU 上会直接压垮填充率。
       自带圆角让 .card 的 overflow 裁剪变成空操作，省掉每帧 mask 合成。 */
    -webkit-backface-visibility:hidden; backface-visibility:hidden;
    -webkit-transition:opacity 3.5s cubic-bezier(.45,0,.55,1);
            transition:opacity 3.5s cubic-bezier(.45,0,.55,1);
    -webkit-animation:kb 16s ease-in-out infinite alternate;
            animation:kb 16s ease-in-out infinite alternate;
  }
  /* alternate + ease-in-out：往返走同一条路，端点速度归零，永远没有循环接缝。
     幅度核算（transform 里 translate 在 scale 之前，所以 px 就是屏幕 px）：
       scale 恒定 1.18（只用来撑出平移空间，全程不变 → 重光栅次数为零）
       水平溢出 800×.18/2 = 72，减去 tx 58 → 左右余量 14
       垂直溢出 480×.18/2 = 43.2，减去 ty 28 → 上下余量 15.2
     Chrome 按 scale 的变化量决定要不要重光栅；scale 不动，纹理就只需光栅化一次，
     之后每帧只是把它挪个位置——这是 GPU 上最便宜的操作。
     全程总位移 116px（上一版 95px），16 秒走完。
     调节旋钮优先动 duration；要改 keyframes 数值必须重算上面这组余量。 */
  @-webkit-keyframes kb {
    from { -webkit-transform:translate3d(-58px,-28px,0) scale(1.18); }
    to   { -webkit-transform:translate3d( 58px, 28px,0) scale(1.18); }
  }
  @keyframes kb {
    from { transform:translate3d(-58px,-28px,0) scale(1.18); }
    to   { transform:translate3d( 58px, 28px,0) scale(1.18); }
  }

  /* 逐张只有这一条。必须写 background-image，不能用 background 简写——
     简写会把基类的 size/position/repeat 一起重置回默认值。
     .tint/.veil 保持页级不做逐张，逐张差异全由 filter 吸收：
     这要求同一页的所有图能吃同一层罩（冷调雪山 / 暖调峡谷各成一组）。 */
  .s-ridge  { background-image:url(ridge.jpg); }
  .s-alex   { background-image:url(alex.jpg); }
  .s-canyon { background-image:url(canyon.jpg); }
  .s-joc    { background-image:url(joc.jpg); }
  .s-yun    { background-image:url(yun.jpg); }
  .veil {
    position:absolute; top:0; right:0; bottom:0; left:0; pointer-events:none; z-index:3;
    background:
      radial-gradient(42% 50% at 88% 62%, rgba(9,13,19,.34), transparent 74%),
      linear-gradient(103deg, rgba(9,13,19,.66) 0%, rgba(9,13,19,.45) 30%,
                              rgba(9,13,19,.10) 58%, rgba(9,13,19,.00) 100%),
      linear-gradient(0deg, rgba(7,10,15,.62) 0%, rgba(7,10,15,.06) 34%, transparent 56%);
  }
  .inner { position:relative; z-index:4; height:100%; padding:44px 48px; display:flex; flex-direction:column; }

  /* ── 抬头 ── */
  .head { display:flex; align-items:center; height:64px; }
  .head .mark { width:46px; height:46px; flex:none; }
  .head .id { margin-left:14px; }
  .head .id .nm { font-size:38px; font-weight:700; letter-spacing:-.018em; line-height:1.02; }
  .head .when { margin-left:auto; text-align:right; line-height:1.32; }
  .head .when .d { font-size:18px; color:rgba(255,255,255,.88); }
  .head .when .l { font-size:18px; color:rgba(255,255,255,.5); }
  /* 旧 WebView 的 CSS 常驻动画会持续唤醒绘制；冒号由 500ms 定时器离散闪烁。 */
  /* 离线就是「停住」的信号，冒号定住 */
  body.offline .cl { -webkit-animation:none; animation:none; }
  body.offline .photo { -webkit-animation-play-state:paused; animation-play-state:paused; }
  /* 看不见的那一页不必动 —— 省一半合成，且暂停保相位，滑回来不跳 */
  .page:not(.active) .photo { -webkit-animation-play-state:paused; animation-play-state:paused; }

  .head .when .v { margin-top:1px; font-size:30px; font-weight:500; letter-spacing:-.012em;
                   font-variant-numeric:tabular-nums; }

  /* ── 用量 ── */
  .usage { margin-top:22px; height:177px; display:flex; align-items:flex-start; }
  .u { width:290px; }
  .u .lb { font-size:20px; color:rgba(255,255,255,.66); letter-spacing:.005em; }
  .u .big {
    margin-top:2px; font-size:108px; font-weight:700; line-height:1.05;
    letter-spacing:-.045em; font-variant-numeric:tabular-nums;
  }
  /* 数字用了 -.045em 负字距，% 被一起拽过去了，单独推开 */
  .u .big i { font-style:normal; font-size:48px; font-weight:700;
              margin-left:10px; letter-spacing:-.01em; }
  .u .frac {
    margin-top:4px; font-size:24px; color:rgba(255,255,255,.72);
    font-variant-numeric:tabular-nums;
  }
  /* 额度见底才变色。平时不喊，喊了才有人听 */
  .u.warn .big { color:#FFA033; }
  .u.crit .big { color:#FF6B6B; }
  .motto {
    margin-left:auto; margin-top:56px; font-size:22px; line-height:1.34;
    color:rgba(255,255,255,.92); letter-spacing:-.005em;
    text-shadow:0 1px 14px rgba(0,0,0,.55);
  }

  /* ── 近期任务 ── */
  /* 高度写死：标题行去掉了，但框不缩，任务在里面上下居中 */
  .recent {
    position:relative; margin-top:auto; height:117px;
    border-radius:20px; padding:0 13px; display:flex; align-items:center;
    /* backdrop-filter 老 WebView 不认，底色本身就够实，糊不了就当没有 */
    background:rgba(17,22,30,.72); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.07);
  }
  /* 播报开关浮到右上角，不进流里，免得把任务顶偏 */
  .recent .go {
    position:absolute; top:11px; right:15px;
    min-width:34px; height:34px; padding:0 13px; border-radius:999px;
    background:rgba(255,255,255,.12); border:0; color:rgba(255,255,255,.62);
    font:inherit; font-size:16px; line-height:34px; letter-spacing:.02em;
  }
  .recent .go.on { background:rgba(76,217,115,.20); color:#7BE39A; }
  /* grid 要 Chrome 57、flex gap 要 84，这块屏都够不着，退回 flex + margin */
  .jobs { flex:1; min-width:0; display:flex; height:74px; }
  .j { position:relative; flex:1 1 0; display:flex; align-items:center; min-width:0;
       padding:0 9px; margin-right:12px; border-radius:10px; }
  .j:last-child { margin-right:0; }

  /* 完成高亮由两秒轮询更新深浅，避免 background-color 动画持续重绘十分钟。 */
  .j.fresh { background:rgba(52,211,120,.10); }

  /* 该你了（要授权 / 在问你）：不会自己消失，一直呼吸 */
  .j.wait { background:rgba(255,166,56,.09); }
  .j.wait::before {
    content:''; position:absolute; top:0; right:0; bottom:0; left:0;
    border-radius:inherit; background:rgba(255,166,56,.15); pointer-events:none;
    /* 只提升这块小提示层，opacity 呼吸不再重绘整张卡片。 */
    will-change:opacity; -webkit-animation:wait 1.9s ease-in-out infinite;
    animation:wait 1.9s ease-in-out infinite;
  }
  @-webkit-keyframes wait { 0%,100% { opacity:0; } 50% { opacity:1; } }
  @keyframes wait { 0%,100% { opacity:0; } 50% { opacity:1; } }

  .j .ic { width:24px; height:24px; flex:none; margin-right:11px; border-radius:50%; }
  .j .tx { flex:1 1 0; min-width:0; overflow:hidden; }
  .j .tt { font-size:17px; color:#fff; line-height:1.28; overflow:hidden; }
  .j .tt .mv { white-space:nowrap; }
  /* 只有装不下的名字才加 run：滚一整份的宽度，两份首尾相接所以无缝 */
  .j .tt.run .mv { -webkit-animation:mq linear infinite; animation:mq linear infinite; }
  .j .tt.run .mv { will-change:transform; }
  .j .tt.run .mv span { padding-right:56px; }
  @-webkit-keyframes mq { 0%,14%   { -webkit-transform:translateX(0); }
                          86%,100% { -webkit-transform:translateX(-50%); } }
  @keyframes mq { 0%,14%   { transform:translateX(0); }
                  86%,100% { transform:translateX(-50%); } }
  .j .sb {
    margin-top:2px; font-size:15px; color:rgba(255,255,255,.5); line-height:1.24;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .j .sb b { font-weight:400; color:#4C93F5; }
  .j.wait .sb b { color:#FFA638; }
  .empty { color:rgba(255,255,255,.34); font-size:17px; line-height:74px; }

  /* Claude 页：品牌色 clay #D97757，和 Codex 页的冷蓝分开 */
  /* 这张自带暖调，冷罩会把它压脏，改成极淡的中性罩只收一点饱和 */
  .page.b .tint { background:rgba(30,22,18,.14); }
  .page.b .veil {
    background:
      radial-gradient(46% 54% at 86% 44%, rgba(10,8,12,.48), transparent 78%),
      linear-gradient(103deg, rgba(10,8,12,.63) 0%, rgba(10,8,12,.42) 32%,
                              rgba(10,8,12,.09) 60%, rgba(10,8,12,.00) 100%),
      linear-gradient(0deg, rgba(8,6,10,.62) 0%, rgba(8,6,10,.08) 34%, transparent 56%);
  }
  .page.b .head .mark { fill:#D97757; }
  .page.b .j .sb b { color:#D97757; }

  body.offline .card { -webkit-filter:grayscale(1); filter:grayscale(1); }

  /* ── 视频背景（仅 Codex 页）──
     渐进增强：图片层始终垫在下面，视频真的播起来了才淡入盖住它，
     淡入走完再把图片层摘掉。autoplay 被禁或解码失败都会静静停在图片上，
     绝不会黑屏。状态挂 <html>，因为 render() 每 2 秒清空 body.className。 */
  .vid {
    position:absolute; top:0; right:0; bottom:0; left:0; z-index:0;
    width:800px; height:480px; object-fit:cover; opacity:0;
    -webkit-backface-visibility:hidden; backface-visibility:hidden;
    -webkit-transition:opacity .8s linear; transition:opacity .8s linear;
  }
  html.vid-a .page.a .vid, html.vid-b .page.b .vid { opacity:1; }
  html.vidx-a .page.a .photo { display:none; }
  html.vidx-b .page.b .photo { display:none; }
  html.page-hidden .photo, html.page-hidden .cl, html.page-hidden .j, html.page-hidden .j::before {
    -webkit-animation-play-state:paused; animation-play-state:paused;
  }
  .deck:not(.p1) .page.b *, .deck.p1 .page.a *, .deck.p2 .page.a *, .deck.p3 .page.a *,
  .deck.p4 .page.a *,
  .deck:not(.p1) .page.b .j::before, .deck.p1 .page.a .j::before,
  .deck.p2 .page.a .j::before, .deck.p3 .page.a .j::before, .deck.p4 .page.a .j::before {
    -webkit-animation-play-state:paused !important; animation-play-state:paused !important;
  }
  html.stable .photo, html.stable .cl, html.stable .j, html.stable .mv, html.stable .j::before {
    -webkit-animation:none !important; animation:none !important;
  }
  html.stable .j.fresh { background:rgba(52,211,120,.10); }
  html.stable .j.wait { background:rgba(255,166,56,.18); }
  .j .ic, .j .tx { position:relative; z-index:1; }

  /* ── Mac 控制页 ──
     不放视频和运镜：这一页是拿来点的，GPU 留给触摸反馈。 */
  /* 状态页夜景、控制页黄昏：和 Codex 雪山 / Claude 峡谷同一路风景，换个时辰。
     图由 scripts/backgrounds.html 程序生成。静态铺底，不放视频也不运镜——
     这两页上面压着图表和图标，GPU 留给它们。上面再罩一层压暗，保证字和图标的对比度。 */
  .page.s .card {
    background:linear-gradient(180deg, rgba(5,8,14,.30) 0%, rgba(5,8,14,.50) 100%),
               #05080e url(night.jpg) center / cover no-repeat;
  }
  .page.c .card {
    background:linear-gradient(180deg, rgba(10,7,16,.25) 0%, rgba(10,7,16,.45) 100%),
               #0d0b1c url(dusk.jpg) center / cover no-repeat;
  }

  /* ── Mac 状态页 ──
     图表规格照 dataviz：2px 线、约 10% 面积底、≥8px 端点带 2px 底色环、发丝级网格。
     触屏没有悬停，所以不做 tooltip；数值都直接写在图上方。 */
  .page.s .head .sub { margin-top:3px; font-size:15px; color:rgba(255,255,255,.55);
                       white-space:nowrap; }
  .tiles { margin-top:14px; }
  .tiles .row { display:flex; }
  .tiles .row + .row { margin-top:14px; }
  /* flex gap 要 Chrome 84，用 margin 代替 */
  .tile {
    flex:1 1 0; min-width:0; height:150px; margin-right:16px; padding:12px 14px 0;
    border-radius:16px; background:rgba(13,18,27,.74); border:1px solid rgba(255,255,255,.08);
  }
  .tile:last-child { margin-right:0; }
  .tile .lb { font-size:15px; color:rgba(255,255,255,.55); line-height:1.2; white-space:nowrap; }
  .tile .val { font-size:36px; font-weight:700; line-height:1.15; letter-spacing:-.02em; }
  .tile .val i { font-style:normal; font-size:20px; font-weight:500; margin-left:3px;
                 color:rgba(255,255,255,.55); }
  .tile .val small { font-size:14px; font-weight:400; margin-left:8px; letter-spacing:0;
                     color:rgba(255,255,255,.55); }
  .tile svg { display:block; margin-top:6px; }
  /* 网络：两条线共用一个轴（同单位），图例 = 色块短线 + 当前值 */
  .tile .keys { float:right; font-size:14px; color:rgba(255,255,255,.75); line-height:18px;
                font-variant-numeric:tabular-nums; }
  .tile .keys span { margin-left:12px; white-space:nowrap; }
  .tile .keys em { font-style:normal; }
  .tile .keys b { display:inline-block; width:12px; height:2px; margin-right:5px;
                  vertical-align:middle; border-radius:1px; }
  /* 进程：一条细 meter，未填满的轨道是同色系浅一档 */
  .proc { margin-top:9px; }
  .proc .p { display:flex; align-items:center; height:30px; }
  .proc .nm { flex:0 0 112px; font-size:15px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .proc .bar { flex:1 1 0; height:6px; margin:0 12px; border-radius:3px; background:rgba(57,135,229,.18); }
  .proc .bar i { display:block; height:6px; border-radius:3px; background:#3987e5; }
  .proc .pc { flex:0 0 44px; text-align:right; font-size:15px; color:rgba(255,255,255,.75);
              font-variant-numeric:tabular-nums; }

  /* 启动台式排布：图标在上、名字在下，图标是 Mac 本机应用的 .icns 现转的 */
  .ctl { margin-top:4px; }
  .ctl .row { display:flex; }
  /* flex gap 要 Chrome 84，用 margin 代替 */
  .ctl .app {
    flex:1 1 0; height:84px; margin-right:12px; border-radius:16px; border:0;
    background:transparent; color:#fff; font:inherit; text-align:center;
    padding:4px 0 0; -webkit-tap-highlight-color:transparent; outline:none;
  }
  .ctl .app:last-child { margin-right:0; }
  .ctl .ico { position:relative; display:block; width:54px; height:54px; margin:0 auto; }
  /* 按下只动 transform：老 GPU 上这是唯一不触发重绘的反馈 */
  .ctl .ico img {
    display:block; width:54px; height:54px;
    -webkit-transition:-webkit-transform .12s ease-out; transition:transform .12s ease-out;
  }
  .ctl .app:active .ico img, .ctl .app.hit .ico img {
    -webkit-transform:scale(.88); transform:scale(.88);
  }
  .ctl .nm {

  /* 开着的开关：图标右上角一个绿点，和任务卡片的「完成」同色；格子太小，不再放状态字 */
  .ctl .app.on .ico::after {

  .ctl-msg { position:absolute; top:56px; left:220px; right:220px; text-align:center;
             font-size:15px; color:rgba(255,255,255,.78); pointer-events:none; }

  /* ── 相册页 ──
     过去两年有人物的照片随机轮播（bridge/photos.py）。图在 Mac 上已裁成屏幕尺寸：
     横图 800×480 一张，竖图 400×480 两张并排。不做运镜——满屏照片平移是最贵的那种合成，

<script>
const $ = id => document.getElementById(id);
let offline = 0, polling = false;
const stable = /[?&]stable=1(?:&|$)/.test(location.search);
if (stable) document.documentElement.classList.add('stable');

const pad = n => (n < 10 ? '0' : '') + n;
const DAY = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// 累计耗时：45s / 12m / 3h 59m
function dur(ms) {
  const s = Math.round((ms || 0) / 1000);
  if (s < 60) return s + 's';
  const m = Math.round(s / 60);
  if (m < 60) return m + 'm';
  return Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
}

// 5 小时窗口当天重置，只显示时间；周窗口保留日期和时间。
function resetLine(w) {
  if (!w || !w.resets_at) return '';
  const d = new Date(w.resets_at * 1000);
  const time = pad(d.getHours()) + ':' + pad(d.getMinutes());
  return w.window_minutes === 300 ? 'Next reset ' + time : MON[d.getMonth()] + ' ' + d.getDate() + ' · ' + time;
}

function quota(box, w, used) {
  const big = box.querySelector('.big'), frac = box.querySelector('.frac');
  if (!w || w.remaining === undefined) {
    box.className = 'u'; big.textContent = '—'; frac.textContent = '';
    return;
  }
  // used 模式下数值和告警方向都要翻过来：剩得少 = 用得多 = 危险
  const v = used ? 100 - w.remaining : w.remaining;
  const level = used
    ? (v >= 90 ? ' crit' : v >= 75 ? ' warn' : '')
    : (v <= 10 ? ' crit' : v <= 25 ? ' warn' : '');
  box.className = 'u' + level;
  big.innerHTML = v + '<i>%</i>';
  frac.textContent = resetLine(w);
}

const ICON = {
  Done:          '<circle cx="13" cy="13" r="13" fill="#22C55E"/><path d="M7.6 13.4l3.5 3.4 7-7.2" stroke="#fff" stroke-width="2.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
  Working:       '<circle cx="13" cy="13" r="11.3" fill="none" stroke="#2F80ED" stroke-width="3.1"/>',
  NeedsApproval: '<circle cx="13" cy="13" r="11.3" fill="none" stroke="#FFA638" stroke-width="3.1"/>',
  idle:          '<circle cx="13" cy="13" r="11.3" fill="none" stroke="#5A6470" stroke-width="3.1"/>',
};

function subline(t) {
  const d = t.total_ms == null ? '' : ' · ' + dur(t.total_ms);
  switch (t.state) {
    case 'Working':       return '<b>Running</b>' + d;
    case 'NeedsApproval': return '<b>Your turn</b>' + d;
    case 'Stopped':       return 'Stopped' + d;
    case 'Done':          return 'Done' + d;
    default:              return 'Idle';
  }
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

const FRESH = 600;

function jobClass(t) {
  if (t.state === 'NeedsApproval') return ' wait';
  if (t.state === 'Done' && t.age_seconds < FRESH) return ' fresh';
  return '';
}

function freshColor(t) {
  if (t.state !== 'Done' || t.age_seconds >= FRESH) return '';
  const alpha = t.age_seconds < 24 ? .30 - .20 * t.age_seconds / 24 : .10;
  return 'rgba(52,211,120,' + alpha.toFixed(3) + ')';
}

function jobStyle(t) {
  const color = freshColor(t);
  return color ? ' style="background-color:' + color + '"' : '';
}

function renderJobs(page, tasks) {
  // 只放得下 3 个；不够就空着，不编
  const items = (tasks || []).slice(0, 3);
  // 高亮单独更新，不为摘 class 重建 DOM，避免打断走马灯。
  const key = items.map(t => t.project + '|' + t.state).join('~');
  const jobs = page.el.querySelector('.jobs');

  // 两页各留一份 key，否则会互相抑制 DOM 重建，走马灯和高亮全乱
  if (key !== page.key) {
    page.key = key;
    jobs.innerHTML = items.length ? items.map(t => `
      <div class="j${jobClass(t)}"${jobStyle(t)}>
        <svg class="ic" viewBox="0 0 26 26">${ICON[t.state] || ICON.idle}</svg>
        <div class="tx">
          <div class="tt"><div class="mv"><span>${esc(t.project || 'Codex')}</span></div></div>
          <div class="sb"></div>
        </div>
      </div>`).join('') : '<div class="empty">暂无任务</div>';
    marquee(jobs);
  }

  // 耗时每次都刷，但只写文本不动结构，走马灯不受影响
  const subs = jobs.querySelectorAll('.sb');
  items.forEach((t, i) => { if (subs[i]) subs[i].innerHTML = subline(t); });
  const rows = jobs.querySelectorAll('.j');
  items.forEach((t, i) => {
    if (!rows[i]) return;
    const className = 'j' + jobClass(t);
    if (rows[i].className !== className) rows[i].className = className;
    rows[i].style.backgroundColor = freshColor(t);
  });
}

function marquee(jobs) {
  const tts = jobs.querySelectorAll('.tt');
  for (let i = 0; i < tts.length; i++) {
    const tt = tts[i], mv = tt.firstElementChild;
    // 差几个像素不值得为它滚一整个名字，裁掉那点比一直动好
    if (mv.scrollWidth <= tt.clientWidth + 6) continue;
    tt.className = 'tt run';                          // 先加 padding，再量
    mv.innerHTML += mv.innerHTML;
    const one = mv.scrollWidth / 2;
    mv.style.webkitAnimationDuration = mv.style.animationDuration = (one / 26 / 0.72).toFixed(1) + 's';
  }
}

// 两页各自的元素和渲染状态。key 必须分开存，否则两页互相抑制 DOM 重建。
const PAGES = {
  // used: 跟随各自官方的展示口径 —— Codex 讲「还剩多少」，Claude 讲「用了多少」
  codex:  { el: document.querySelector('.page.a'), key: null, used: false },
  claude: { el: document.querySelector('.page.b'), key: null, used: true },
};
const deck = $('deck'), dotEls = $('dots').children;
// 页序与各页 DOM。状态页、控制页、相册页不在 PAGES 里：它们没有 agent 数据、背景和视频，只借用抬头的时钟
let ORDER = ['codex', 'claude', 'sys', 'mac', 'photo'];
const MAC = { el: document.querySelector('.page.c') };
const SYS = { el: document.querySelector('.page.s') };
const PHOTO = { el: document.querySelector('.page.f') };
const EXTRA = [SYS, MAC, PHOTO];
const ALL_PAGES = {
  codex: PAGES.codex.el,
  claude: PAGES.claude.el,
  sys: SYS.el,
  mac: MAC.el,
  photo: PHOTO.el,
};

// ── 显示哪一页（支持 /setting 动态编排，URL 查询参数仍可覆盖） ──
let view = 'codex', pin = null, pinAt = 0;
let PIN_MS = 60000;   // 手动滑动后钉住多久，之后交还自动轮播
function querySecs(name) {
  const m = location.search.match(new RegExp('[?&]' + name + '=(\\d+)'));
  return m ? +m[1] * 1000 : null;
}
const Q_ROTATE = querySecs('rotate');
const Q_PHOTO = querySecs('photo');
const Q_IDLE = querySecs('idle');

let rotateOn = Q_ROTATE !== 0;
let followUrgent = true, followWorking = true;
let DWELL = { codex: 60000, claude: 60000, sys: 60000, mac: 60000, photo: 300000 };
function dwell(k) {
  if (k === 'photo' && Q_PHOTO !== null) return Q_PHOTO;
  if (k !== 'photo' && Q_ROTATE !== null) return Q_ROTATE;
  return DWELL[k] || 60000;
}
// 两边都没任务在跑超过这么久，就当相框停在相册页；有任务跑起来再回去轮播。?idle=0 关掉
let IDLE_MS = Q_IDLE !== null ? Q_IDLE : 600000;
let SLIDE_MS = 12000;
let busyAt = Date.now(), idle = false;
let rotateAt = Date.now();
let focusSeq = null, photoCfgKey = null, macItemsKey = null;
let lastMacState = null;

function renderMacItems(items) {
  if (!Array.isArray(items)) return;
  const key = items.map(function (it) { return it.id + '|' + it.name + '|' + (it.path || ''); }).join('~');
  if (key === macItemsKey) return;
  macItemsKey = key;
  const rows = [];
  for (let r = 0; r < items.length; r += 4) {
    const chunk = items.slice(r, r + 4);
    let cells = chunk.map(function (it) {
      const awakeId = it.id === 'awake' ? ' id="awake"' : '';
      return '<button class="app" data-a="' + esc(it.id) + '"' + awakeId + '>' +
        '<span class="ico"><img src="icons/' + encodeURIComponent(it.id) + '.png" alt=""></span>' +
        '<span class="nm">' + esc(it.name) + '</span></button>';
    }).join('');
    for (let padIdx = chunk.length; padIdx < 4; padIdx++) {
      cells += '<div class="app" style="visibility:hidden"></div>';
    }
    rows.push('<div class="row">' + cells + '</div>');
  }
  $('ctl').innerHTML = rows.join('');
  if (lastMacState) renderMac(lastMacState);
}

function syncVideos() {
  const root = document.documentElement;
  for (const k in PAGES) {
    const v = PAGES[k].el.querySelector('.vid');
    if (!v || !v._source || v._failed) continue;
    const side = k === 'codex' ? 'a' : 'b';
    if (document.hidden || k !== view) {
      if (v.getAttribute('src')) {
        v.pause();
        clearTimeout(v._fade);
        v.removeAttribute('src');
        v.load();                       // 释放隐藏页的解码器和视频缓冲
        root.classList.remove('vid-' + side, 'vidx-' + side);
      }
    } else if (offline >= 3) {
      v.pause();
    } else if (!v.getAttribute('src')) {
      v.src = v._source;                // 等 loadeddata 再 play，避免老 WebView 的 AbortError
      root.classList.add('vid-' + side);
    } else if (v.readyState >= 2 && v.paused) {
      const p = v.play();
      if (p && p.catch) p.catch(function () {});
    }
  }
}

function show(k, force) {
  const idx = ORDER.indexOf(k);
  if (idx < 0 || (k === view && !force)) return;
  view = k;
  // 分页状态挂 deck 不挂 body：render() 每次都会清掉 body.className
  for (let i = 1; i < 5; i++) {
    deck.classList.toggle('p' + i, idx === i);   // 用 toggle，别整体赋值——会冲掉 dragging
  }
  for (const id in ALL_PAGES) {
    ALL_PAGES[id].classList.toggle('active', id === k);
  }
  syncVideos();
  for (let i = 0; i < dotEls.length; i++) dotEls[i].className = i === idx ? 'on' : '';
}

function pinTo(k) { pin = k; pinAt = Date.now(); show(k); }   // 手动：临时钉住

function applySettings(s) {
  if (!s) return;
  if (s.pin_seconds) PIN_MS = s.pin_seconds * 1000;
  if (s.slide_seconds) SLIDE_MS = s.slide_seconds * 1000;
  if (Q_ROTATE === null) rotateOn = s.rotate !== false;
  followUrgent = s.follow_urgent !== false;
  followWorking = s.follow_working !== false;
  if (Q_IDLE === null) {
    IDLE_MS = s.idle_photo === false ? 0 : (s.idle_seconds || 600) * 1000;
  }
  if (!IDLE_MS && idle) idle = false;

  if (Array.isArray(s.pages)) {
    const nextOrder = [];
    s.pages.forEach(function (p) {
      if (!p || !ALL_PAGES[p.id]) return;
      if (p.dwell) DWELL[p.id] = p.dwell * 1000;
      if (p.enabled) nextOrder.push(p.id);
    });
    if (!nextOrder.length) nextOrder.push('codex');
    if (nextOrder.join(',') !== ORDER.join(',')) {
      ORDER = nextOrder;
      for (const id in ALL_PAGES) {
        const idx = ORDER.indexOf(id);
        if (idx < 0) {
          ALL_PAGES[id].style.display = 'none';
          ALL_PAGES[id].classList.remove('active');
        } else {
          ALL_PAGES[id].style.display = '';
          ALL_PAGES[id].style.left = (idx * 800) + 'px';
        }
      }
      deck.style.width = (ORDER.length * 800) + 'px';
      $('dots').innerHTML = ORDER.map(function () { return '<i></i>'; }).join('');
      $('dots').hidden = ORDER.length <= 1;
      const target = ORDER.indexOf(view) >= 0 ? view : ORDER[0];
      show(target, true);
      rotateAt = Date.now();
    }
  }

  if (s.focus && typeof s.focus.seq === 'number') {
    if (focusSeq === null) {
      focusSeq = s.focus.seq;
    } else if (s.focus.seq !== focusSeq) {
      focusSeq = s.focus.seq;
      if (s.focus.page && ORDER.indexOf(s.focus.page) >= 0) {
        idle = false;
        pinTo(s.focus.page);
      }
    }
  }

  const pKey = (s.photo_years || 2) + ':' + (s.photo_count || 300) + ':' + ((s.photo_people || []).join(','));
  if (photoCfgKey !== null && photoCfgKey !== pKey) loadAlbum();
  photoCfgKey = pKey;

  if (Array.isArray(s.mac_items)) renderMacItems(s.mac_items);
  if ($('volBar')) $('volBar').hidden = s.mac_volume_bar === false;
}

// 哪个 agent 在等你（要授权 / 在问你）。轮播会把它错过，所以它优先
function waiting(d) {
  for (const k in PAGES) {
    if (ORDER.indexOf(k) < 0) continue;
    const a = (d.agents || {})[k];
    if (a && (a.tasks || []).some(t => t.state === 'NeedsApproval')) return k;
  }
  return null;
}

// 哪个 agent 正在干活。Working 超过 15 分钟没动静后端会报成 Stopped，这里不用再判超时
function running(d) {
  for (const k in PAGES) {
    if (ORDER.indexOf(k) < 0) continue;
    const a = (d.agents || {})[k];
    if (a && (a.tasks || []).some(t => t.state === 'Working')) return k;
  }
  return null;
}

function follow(d) {                                          // 自动：轮播，等你的优先
  const now = Date.now();
  if (pin) {
    if (now - pinAt < PIN_MS) return;
    pin = null;                                               // 钉住到期，交还自动
    rotateAt = now;                                           // 从当前页重新计时，别立刻跳走
  }
  const urgent = followUrgent ? waiting(d) : null;
  if (urgent) {                                               // 停在等你的那页，直到你处理掉
    show(urgent);
    rotateAt = now;
    return;
  }
  const work = running(d);
  if (work) {
    busyAt = now;
    if (idle && followWorking) {                              // 相框模式下来活了：直接去干活的那页
      idle = false;
      show(work);
      rotateAt = now;
      return;
    }
  } else if (IDLE_MS && ORDER.indexOf('photo') >= 0 && album.slides.length && now - busyAt >= IDLE_MS) {
    idle = true;                                              // 闲着：停在相册，不轮播
    show('photo');
    rotateAt = now;
    return;
  }
  if (rotateOn && ORDER.length > 1 && now - rotateAt >= dwell(view)) {
    let idx = (ORDER.indexOf(view) + 1) % ORDER.length;       // 走到头绕回第一页
    if (ORDER[idx] === 'photo' && !album.slides.length) idx = (idx + 1) % ORDER.length;  // 没照片就别停在空页上
    show(ORDER[idx]);
    rotateAt = now;
  }
}

function renderPage(page, a) {
  const us = page.el.querySelectorAll('.u'), u = a.usage || {};
  quota(us[0], u.primary, page.used);
  quota(us[1], u.secondary, page.used);
  renderJobs(page, a.tasks);
}

// 冒号是 .cl 里的独立节点，只写 .hh/.mm，闪烁动画才不会每 2 秒被 render() 重建。
// 以后要加秒数显示，也别往 .clock 整体写 textContent。
function setClock(page, hh, mm) {
  page.el.querySelector('.hh').textContent = hh;
  page.el.querySelector('.mm').textContent = mm;
}

function blinkClock() {
  const visible = stable || offline >= 3 || document.hidden || Date.now() % 1000 < 500;
  for (const k in PAGES) {
    PAGES[k].el.querySelector('.cl').style.visibility = visible ? '' : 'hidden';
  }
  EXTRA.forEach(function (page) { page.el.querySelector('.cl').style.visibility = visible ? '' : 'hidden'; });
}

function render(d) {
  document.body.className = '';
  const now = new Date();
  const date = DAY[now.getDay()] + ', ' + MON[now.getMonth()] + ' ' + now.getDate();

  for (const k in PAGES) {
    const page = PAGES[k], a = (d.agents || {})[k];
    page.el.querySelector('.today').textContent = date;
    setClock(page, pad(now.getHours()), pad(now.getMinutes()));
    if (a) renderPage(page, a);
  }
  EXTRA.forEach(function (page) {
    page.el.querySelector('.today').textContent = date;
    setClock(page, pad(now.getHours()), pad(now.getMinutes()));
  });
  renderMac(d.mac);
  renderSys(d.system);
  applySettings(d.settings);

  follow(d);
  renderSpeak(d.speaking);
}

// speaking 为 null 表示这次启动没开播报能力，开关不该出现
function renderSpeak(v) {
  const b = $('speak');
  b.hidden = v === null || v === undefined;
  b.className = 'go' + (v ? ' on' : '');
  b.textContent = v ? '播报 开' : '播报 关';
}

$('speak').onclick = async () => {
  try {
    // 写操作都要带这个头，服务端靠它挡掉跨站请求（见 bridge/access.py）
    const r = await fetch('/api/speak', { method: 'POST', headers: { 'X-LX04-Action': '1' } });
    renderSpeak((await r.json()).speaking);
  } catch (e) { /* 下一次轮询会把状态拉回来 */ }
};

function tick() {
  if (polling || document.hidden) return;
  polling = true;
  const xhr = new XMLHttpRequest();
  // Chromium 61 没有 AbortController。原来的 fetch 断网时可能一直挂起，
  // 两秒一轮会累积连接；XHR 超时让每个页面始终最多只有一个在途请求。
  xhr.open('GET', '/api/status', true);
  xhr.timeout = 5000;
  function failed() {
    polling = false;
    // 连续三次失败才判定离线，避免瞬时抖动就把屏幕灰掉
    if (++offline >= 3) {
      document.body.className = 'offline';
      for (const k in PAGES) setClock(PAGES[k], '--', '--');
      EXTRA.forEach(function (page) { setClock(page, '--', '--'); });
      renderSpeak(null);
      syncVideos();
    }
  }
  xhr.onload = function () {
    polling = false;
    try {
      if (xhr.status !== 200) throw new Error(xhr.status);
      const data = JSON.parse(xhr.responseText);
      offline = 0;
      render(data);
      syncVideos();
    } catch (e) { failed(); }
  };
  xhr.onerror = xhr.ontimeout = xhr.onabort = failed;
  xhr.send();
}

document.addEventListener('visibilitychange', function () {
  document.documentElement.classList.toggle('page-hidden', document.hidden);
  syncVideos();
  if (!document.hidden) tick();
}, false);
// ── 手势：跟手 + 磁吸 ──
// 不能靠 touchmove 里的 preventDefault：老 WebView 上 document 级 touchmove 默认 passive，
// 那句话会被静默忽略，浏览器照样自己滚。真正管用的是 CSS 的 touch-action:pan-y。
const SNAP = 200;      // 拖过这么多才翻页，否则弹回原处
let drag = false, startX = 0, startY = 0, baseX = 0, axis = null, lastTouch = 0;

function baseOf(k) { return -800 * ORDER.indexOf(k); }

document.addEventListener('touchstart', function (e) {
  const t = e.changedTouches[0];
  startX = t.clientX; startY = t.clientY;
  baseX = baseOf(view); axis = null; drag = true;
  lastTouch = Date.now();
  deck.style.webkitTransition = deck.style.transition = 'none';   // 跟手时不要过渡
  deck.classList.add('dragging');                                 // 停运镜、提示合成层
}, false);

document.addEventListener('touchmove', function (e) {
  if (!drag) return;
  const t = e.changedTouches[0], dx = t.clientX - startX, dy = t.clientY - startY;
  // 先定轴：判成纵向就整段让给浏览器，它要靠这个收控制条
  if (axis === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
    axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
  }
  if (axis !== 'x') return;
  // 夹在两页之间，滑不出界
  const x = Math.max(-800 * (ORDER.length - 1), Math.min(0, baseX + dx));
  deck.style.webkitTransform = deck.style.transform = 'translateX(' + x + 'px)';
}, false);

function endDrag(e) {
  if (!drag) return;
  drag = false;
  lastTouch = Date.now();
  deck.style.webkitTransition = deck.style.transition = '';   // 交还 CSS 过渡
  deck.style.webkitTransform = deck.style.transform = '';     // 位置交还 class
  // 等 0.28s 的回位过渡走完再恢复运镜，别在最重的那一帧上加动画
  clearTimeout(window.dragT);
  window.dragT = setTimeout(function () { deck.classList.remove('dragging'); }, 340);
  if (axis !== 'x') return;
  const dx = e.changedTouches[0].clientX - startX;
  // 拖够了就翻页，不够就吸回原处——无论如何都停在整页上
  pinTo(Math.abs(dx) >= SNAP ? step(dx < 0 ? 1 : -1) : view);
}
document.addEventListener('touchend', endDrag, false);
document.addEventListener('touchcancel', endDrag, false);

// 退路：万一只送达 click 不送达 touch，点左右半屏也能切
function step(d) {
  const i = Math.max(0, Math.min(ORDER.length - 1, ORDER.indexOf(view) + d));
  return ORDER[i];
}

document.addEventListener('click', function (e) {
  if (Date.now() - lastTouch < 700) return;      // 滑动尾部会补一个 click，滤掉
  if (e.target.className.indexOf && e.target.className.indexOf('go') >= 0) return;
  if (view === 'mac') return;                    // 控制页满屏是按钮，点空白不翻页
  pinTo(step(e.clientX < 400 ? -1 : 1));
}, false);

// ── Mac 状态 ──
function gb(bytes) {
  const g = bytes / 1073741824;
  return g >= 1000 ? (g / 1024).toFixed(1) + ' TB' : (g >= 100 ? Math.round(g) : g.toFixed(1)) + ' GB';
}

function rate(bps) {
  if (bps >= 1048576) return (bps / 1048576).toFixed(1) + ' MB/s';
  if (bps >= 1024) return Math.round(bps / 1024) + ' KB/s';
  return Math.round(bps) + ' B/s';
}

function uptime(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? d + 'd ' + h + 'h' : h ? h + 'h ' + m + 'm' : m + 'm';
}

// 网速轴的上限取整到 1/2/5×10ⁿ，刻度读起来是干净的数
function niceMax(v) {
  if (!(v > 0)) return 1024;
  const e = Math.pow(10, Math.floor(Math.log(v) / Math.LN10)), f = v / e;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * e;
}

const SURFACE = '#111720', GRID = 'rgba(255,255,255,.09)', HISTORY = 120;
const BLUE = '#3987e5', ORANGE = '#d95926';   // dataviz 深色板前两槽，已对 #111720 验过

// 一条线 + 面积底 + 末端点。最新的点贴右边，历史不够长时从右往左长；null 处断开
function series(vals, w, h, max, color, area) {
  const step = w / (HISTORY - 1), off = HISTORY - vals.length;
  let line = '', fill = '', seg = [], last = null;
  function flush() {
    if (seg.length > 1) {
      line += 'M' + seg.join('L');
      if (area) fill += 'M' + seg[0].split(',')[0] + ',' + h + 'L' + seg.join('L') + 'L' + seg[seg.length - 1].split(',')[0] + ',' + h + 'Z';
    }
    seg = [];
  }
  vals.forEach(function (v, i) {
    if (v == null) { flush(); return; }
    const x = ((off + i) * step).toFixed(1);
    const y = (h - 2 - Math.min(v / max, 1) * (h - 6)).toFixed(1);   // 上下各留出端点的半径
    seg.push(x + ',' + y);
    last = [x, y];
  });
  flush();
  let out = '';
  if (fill) out += '<path d="' + fill + '" fill="' + color + '" fill-opacity=".12"/>';
  if (line) out += '<path d="' + line + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  if (last) out += '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="4" fill="' + color + '" stroke="' + SURFACE + '" stroke-width="2"/>';
  return out;
}

function grid(w, h, rows) {
  let g = '';
  rows.forEach(function (f) {
    const y = (h - 2 - f * (h - 6)).toFixed(1);
    g += '<line x1="0" x2="' + w + '" y1="' + y + '" y2="' + y + '" stroke="' + GRID + '" stroke-width="1"/>';
  });
  return g;
}

// 百分比图：固定 0–100，网格在 0/50/100，三张卡片同一把尺子，能横着比
function pctChart(id, vals) {
  const svg = $(id), w = +svg.getAttribute('width'), h = +svg.getAttribute('height');
  svg.innerHTML = grid(w, h, [0, .5, 1]) + series(vals || [], w, h, 100, BLUE, true);
}

function netChart(rx, tx) {
  const svg = $('chNet'), w = +svg.getAttribute('width'), h = +svg.getAttribute('height');
  const peak = Math.max.apply(null, (rx || []).concat(tx || []).filter(v => v != null).concat([0]));
  const max = niceMax(peak);
  // 只标顶部那条刻度：底下是 0 不言自明
  svg.innerHTML = grid(w, h, [0, .5, 1]) +
    '<text x="0" y="13" fill="rgba(255,255,255,.45)" font-size="12">' + rate(max) + '</text>' +
    series(rx || [], w, h, max, BLUE, true) + series(tx || [], w, h, max, ORANGE, false);
}

function pctVal(id, v, extra) {
  $(id).innerHTML = v == null ? '—'
    : Math.round(v) + '<i>%</i>' + (extra ? '<small>' + extra + '</small>' : '');
}

let sysKey = null;
function renderSys(x) {
  if (!x) return;
  if (x.model) $('sysModel').textContent = x.model.replace(/^Apple /, '');
  const sub = [];
  if (x.disk) sub.push('Disk ' + x.disk.percent + '%, ' + gb(x.disk.total - x.disk.used) + ' free');
  const b = x.battery;
  sub.push(b ? 'Battery ' + b.percent + '%' + (b.charging ? ', charging' : b.ac ? ', AC' : '') : 'AC power');
  if (x.uptime != null) sub.push('Up ' + uptime(x.uptime));
  $('sysSub').textContent = sub.join('  ·  ');

  const h = x.history || {};
  pctVal('sysCpu', x.cpu, x.cores ? 'load ' + x.load : '');
  pctVal('sysGpu', x.gpu && x.gpu.percent, x.gpu && x.gpu.mem ? gb(x.gpu.mem) : '');
  pctVal('sysMem', x.mem && x.mem.percent, x.mem ? gb(x.mem.used) + ' / ' + gb(x.mem.total) : '');
  pctChart('chCpu', h.cpu);
  pctChart('chGpu', h.gpu);
  pctChart('chMem', h.mem);
  $('sysRx').textContent = x.net ? '↓ ' + rate(x.net.rx) : '↓ —';
  $('sysTx').textContent = x.net ? '↑ ' + rate(x.net.tx) : '↑ —';
  netChart(h.rx, h.tx);

  // 名字变了才重建 DOM，数字和条长只改属性——两秒一次，别整块重绘
  const top = x.top || [], box = $('sysTop');
  const key = top.map(t => t.name).join('~');
  if (key !== sysKey) {
    sysKey = key;
    box.innerHTML = top.map(t => '<div class="p"><div class="nm">' + esc(t.name) +
      '</div><div class="bar"><i></i></div><div class="pc"></div></div>').join('');
  }
  const bars = box.querySelectorAll('.bar i'), pcs = box.querySelectorAll('.pc');
  top.forEach(function (t, i) {
    // ps 的百分比按单核计，多线程进程会过 100；条按一个核封顶，数字照实写
    if (bars[i]) bars[i].style.width = Math.min(t.cpu, 100) + '%';
    if (pcs[i]) pcs[i].textContent = t.cpu + '%';
  });
}

// ── Mac 控制 ──
function renderMac(m) {
  lastMacState = m;
  const b = $('awake'), on = !!(m && m.awake);
  if (b) b.classList.toggle('on', on);           // 只动 on，别冲掉 hit/bad
  const vm = $('volMute');
  if (vm) {
    const muted = !!(m && m.muted);
    vm.classList.toggle('on', muted);
    const lb = vm.querySelector('.nm');
    if (lb) lb.textContent = muted ? '已静音' : (m && m.volume != null ? '静音 · ' + m.volume + '%' : '静音');
  }
}

let acting = false;
function act(btn) {
  if (acting) return;                            // 一次一个，避免连点叠出多个请求
  acting = true;
  pinAt = Date.now();                            // 正在用就别被自动跟随拽走
  const msg = $('ctlMsg');
  btn.classList.add('hit');
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/action?name=' + encodeURIComponent(btn.getAttribute('data-a')), true);
  xhr.setRequestHeader('X-LX04-Action', '1');    // 服务端靠它挡掉跨站请求
  xhr.timeout = 8000;
  function done(ok, text) {
    acting = false;
    btn.classList.remove('hit');
    btn.classList.toggle('bad', !ok);
    msg.textContent = text;
    clearTimeout(window.msgT);
    window.msgT = setTimeout(function () {
      msg.textContent = '';
      btn.classList.remove('bad');
    }, 3000);
  }
  xhr.onload = function () {
    try {
      const r = JSON.parse(xhr.responseText);
      renderMac(r.mac);
      // 开关类的消息自带名字（「防休眠已开启」），只给笼统的「已执行」补上是谁
      const nm = btn.querySelector('.nm').textContent;
      done(r.ok, r.message.indexOf(nm) === 0 ? r.message : nm + ' · ' + r.message);
    } catch (e) {
      done(false, xhr.status === 403 ? '这台设备没有控制权限' : '执行失败');
    }
  };
  xhr.onerror = xhr.ontimeout = function () { done(false, '连不上 Mac'); };
  xhr.send();
}

function bindAct(box) {
  if (!box) return;
  box.addEventListener('click', function (e) {
    let t = e.target;
    while (t && t !== this && !t.getAttribute('data-a')) t = t.parentNode;
    if (t && t !== this) act(t);
  }, false);
}
bindAct($('ctl'));
bindAct($('volBar'));

// ── 背景轮换 ──
// 每页两层：底层恒不透明，只把上层从 0 淡到 1。两层同时半透明是错的——
// 中点各 .5 时覆盖率只有 75%，.card 底色会透上来，画面中途发暗。
const SHOTS = {
  codex:  ['s-ridge', 's-alex'],
  claude: ['s-canyon', 's-joc', 's-yun'],
};
const SHOT_MS = 90000;    // 1.5 分钟

for (const k in PAGES) {
  PAGES[k].i = 0;
  PAGES[k].photos = PAGES[k].el.querySelectorAll('.photo');
  // 备用层平时不参与合成。用 visibility 不用 display —— 后者会让尺寸测量全变 0
  PAGES[k].photos[1].style.visibility = 'hidden';
}

function advance(page, shots) {
  page.i++;
  const inc = page.photos[page.i & 1], out = page.photos[(page.i + 1) & 1];
  inc.style.webkitTransition = inc.style.transition = 'none';
  inc.style.opacity = '0';
  inc.style.zIndex = '1';
  out.style.zIndex = '0';
  // 只增删 s-* token，photo 类全程不动 —— 整体赋值 className 会让 .photo
  // 有一瞬间不匹配，运镜动画被移除再添加，currentTime 归零，两层就错相了。
  const names = inc.className.split(' ');
  for (let n = 0; n < names.length; n++) {
    if (names[n].indexOf('s-') === 0) inc.classList.remove(names[n]);
  }
  inc.classList.add(shots[page.i % shots.length]);
  void inc.offsetWidth;                                       // 让 opacity:0 先落地
  inc.style.webkitTransition = inc.style.transition = '';     // 交还 CSS 的 3.5s
  inc.style.visibility = '';
  inc.style.opacity = '1';
  // 淡入结束后收起出场层：稳态下只有一层在合成
  clearTimeout(page.hideT);
  page.hideT = setTimeout(function () { out.style.visibility = 'hidden'; }, 3700);
}

setInterval(function () {
  if (stable || offline >= 3) return;  // 稳定模式使用静态背景
  for (const k in PAGES) advance(PAGES[k], SHOTS[k]);
}, SHOT_MS);

// ── 相册 ──
// 列表十分钟拉一次；只在相册页可见时换图，翻走了就停在原处，下次回来接着放
const album = { moments: [], slides: [], i: -1, top: 0, busy: false, shownAt: 0 };

// 竖图两两并排成一屏：相邻的两张竖图凑一对（服务端已把竖图排成挨着的），落单的居中
function toSlides(list) {
  const out = [];
  let lone = null;
  list.forEach(function (p) {
    if (!p.portrait) { out.push([p]); return; }
    if (lone) { out.push([lone, p]); lone = null; return; }
    lone = p;
  });
  if (lone) out.push([lone]);
  return out;
}

function momentDate(t) {
  if (!t.start) return '';
  const a = new Date(t.start * 1000), b = new Date(t.end * 1000);
  const ma = MON[a.getMonth()], mb = MON[b.getMonth()];
  if (a.getFullYear() !== b.getFullYear()) {
    return ma + ' ' + a.getDate() + ', ' + a.getFullYear() + ' – ' + mb + ' ' + b.getDate() + ', ' + b.getFullYear();
  }
  const range = a.getDate() === b.getDate() && ma === mb ? ma + ' ' + a.getDate()
    : ma === mb ? ma + ' ' + a.getDate() + ' – ' + b.getDate()
    : ma + ' ' + a.getDate() + ' – ' + mb + ' ' + b.getDate();
  return range + ', ' + a.getFullYear();
}

function loadAlbum() {
  const xhr = new XMLHttpRequest();
  xhr.open('GET', '/api/photos', true);
  xhr.timeout = 10000;
  xhr.onload = function () {
    try {
      const r = JSON.parse(xhr.responseText);
      album.moments = r.moments || [];
      album.slides = toSlides(r.photos || []);
      if (album.i >= album.slides.length) album.i = -1;
      $('phNone').hidden = album.slides.length > 0;
      if (view === 'photo' && album.i < 0) nextSlide();
    } catch (e) { /* 下一轮再试 */ }
  };
  xhr.send();
}

function nextSlide() {
  if (album.busy || !album.slides.length) return;
  album.busy = true;
  const i = (album.i + 1) % album.slides.length, shot = album.slides[i];
  const layer = album.top ? $('slA') : $('slB'), under = album.top ? $('slB') : $('slA');
  // 先把图全部下完再淡入：一边下载一边显示，老 WebView 会一条一条刷出来
  let left = shot.length, failed = false;
  const imgs = shot.map(function (p, n) {
    const img = new Image();
    img.onload = img.onerror = function (e) {
      if (e.type === 'error') failed = true;
      if (--left) return;
      album.busy = false;
      album.i = i;
      if (failed) return;                    // 这一张跳过，下一轮放后面的
      layer.style.webkitTransition = layer.style.transition = 'none';
      layer.style.opacity = '0';
      layer.innerHTML = '';
      imgs.forEach(function (im, k) {
        // 一张竖图居中，两张左右各占一半
        im.style.left = (shot.length === 2 ? k * 400 : (shot[0].portrait ? 200 : 0)) + 'px';
        layer.appendChild(im);
      });
      layer.style.zIndex = '1';
      under.style.zIndex = '0';
      void layer.offsetWidth;                // 让 opacity:0 先落地
      layer.style.webkitTransition = layer.style.transition = '';
      layer.style.opacity = '1';
      album.top = 1 - album.top;
      // 两张竖图可能来自不同时刻，标题跟左边那张
      const t = album.moments[shot[0].moment];
      $('phPlace').textContent = t ? t.place : '';
      $('phDate').textContent = t ? momentDate(t) : '';
      album.shownAt = Date.now();
    };
    img.src = '/photos/' + p.id + '.jpg';
    return img;
  });
}

setInterval(function () {
  if (view !== 'photo' || document.hidden || offline >= 3) return;
  if (album.i < 0 || Date.now() - album.shownAt >= SLIDE_MS) nextSlide();
}, 1000);
loadAlbum();
setInterval(loadAlbum, 600000);

// ?page=codex|claude|sys|mac|photo 固定某一页（钉住 60 秒后照常轮播）：触摸万一不可用时的退路，也方便对着看
const forced = location.search.match(/[?&]page=(codex|claude|sys|mac|photo)/);
if (forced) pinTo(forced[1]);

tick();
setInterval(tick, 2000);
blinkClock();
setInterval(blinkClock, 500);

// ── 视频背景：能播就播，播不了就安静地留在图片上 ──
// 不用 autoplay 属性：靠 playing 事件确认「真的在放」才切换，
// 老引擎没有 play() 的 Promise，playing 是两种引擎都可靠的信号。
(function () {
  if (stable || /[?&]bg=img/.test(location.search)) return;
  const root = document.documentElement;
  // ?v= 由服务端按 mp4 的 mtime 填入，重烘后 URL 就变了，绕开浏览器的旧副本
  const SRC = { a: 'meili-lite.mp4?v=__V__', b: 'canyon-lite.mp4?v=__V__' };
  for (const side in SRC) {
    const v = document.querySelector('.page.' + side + ' .vid');
    if (!v) continue;
    v._source = SRC[side];
    v.muted = true;
    v.addEventListener('loadeddata', (function (s, el) {
      return function () {
        if (!el.getAttribute('src') || document.hidden || offline >= 3 ||
            (s === 'a') !== (view === 'codex')) return;
        if (el.paused) {
          const pp = el.play();
          if (pp && pp.catch) pp.catch(function () {});
        }
      };
    })(side, v), false);
    v.addEventListener('playing', (function (s, el) {
      return function () {
        clearTimeout(el._fade);
        el._fade = setTimeout(function () {
          if (!el.paused && el.getAttribute('src')) root.classList.add('vidx-' + s);
        }, 900);
      };
    })(side, v), false);
    v.addEventListener('error', (function (s, el) {
      return function () {
        el._failed = true;
        clearTimeout(el._fade);
        el.pause();
        el.removeAttribute('src');
        el.load();
        root.classList.remove('vid-' + s, 'vidx-' + s);
      };
    })(side, v), false);
  }
  syncVideos();
})();

</script>
</body>
